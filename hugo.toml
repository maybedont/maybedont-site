baseURL = 'https://maybedont.ai/'
languageCode = 'en-us'
title = "Maybe Don't, AI"

# Use Hextra theme via Hugo modules
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

# Navigation menu
[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Download"
    pageRef = "/docs/download"
    weight = 2
  [[menu.main]]
    name = "Pricing"
    pageRef = "/pricing"
    weight = 3
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 4
  [[menu.main]]
    identifier = "theme-toggle"
    weight = 5
    [menu.main.params]
      type = "theme-toggle"

# Site parameters
[params]
  description = "AI Security Guardrails - Real-time monitoring and intelligent blocking for AI agents"

  # Navbar settings
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.png"
      dark = "images/logo.png"
      width = 42
      height = 42

  # Footer configuration
  [params.footer]
    displayCopyright = true
    displayPoweredBy = false
    displayModeToggle = false

  # Search
  [params.search]
    enable = true
    type = "flexsearch"

  # Theme settings
  [params.theme]
    default = "system"
    displayToggle = true

  # Edit link for docs (optional)
  [params.editURL]
    enable = false

# Disable taxonomies (keep existing behavior)
disableKinds = ["taxonomy", "term"]

# Cache configuration
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Markdown rendering
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = false
