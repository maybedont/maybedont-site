<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrowIn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#6699FF"/>
    </marker>
    <marker id="arrowOut" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#6699FF"/>
    </marker>
    <!-- Gemini gradient -->
    <linearGradient id="geminiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4"/>
      <stop offset="33%" style="stop-color:#EA4335"/>
      <stop offset="66%" style="stop-color:#FBBC04"/>
      <stop offset="100%" style="stop-color:#34A853"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="880" height="300" rx="12" fill="#1f1f1f"/>

  <!-- ===== LEFT SIDE: AI Agents ===== -->

  <!-- Agent 1: Claude -->
  <rect x="25" y="30" width="135" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Claude starburst/asterisk icon -->
  <g transform="translate(40, 40)">
    <path d="M12,0 L13.5,9 L12,7 L10.5,9 Z" fill="#D97706"/>
    <path d="M24,12 L15,13.5 L17,12 L15,10.5 Z" fill="#D97706"/>
    <path d="M12,24 L10.5,15 L12,17 L13.5,15 Z" fill="#D97706"/>
    <path d="M0,12 L9,10.5 L7,12 L9,13.5 Z" fill="#D97706"/>
    <path d="M20.5,3.5 L14,10 L15.5,9.5 L14,8 Z" fill="#D97706"/>
    <path d="M3.5,20.5 L10,14 L8.5,14.5 L10,16 Z" fill="#D97706"/>
    <path d="M20.5,20.5 L14,14 L14.5,15.5 L16,14 Z" fill="#D97706"/>
    <path d="M3.5,3.5 L10,10 L9.5,8.5 L8,10 Z" fill="#D97706"/>
  </g>
  <text x="105" y="57" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">Claude</text>

  <!-- Agent 2: ChatGPT -->
  <rect x="25" y="85" width="135" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <!-- ChatGPT OpenAI hexagon swirl -->
  <g transform="translate(40, 95)">
    <path d="M12,2 L20,6.5 L20,15.5 L12,20 L4,15.5 L4,6.5 Z" fill="none" stroke="#10a37f" stroke-width="1.5"/>
    <path d="M12,6 L16,8.5 L16,13.5 L12,16 L8,13.5 L8,8.5 Z" fill="none" stroke="#10a37f" stroke-width="1.5"/>
    <circle cx="12" cy="11" r="2" fill="#10a37f"/>
  </g>
  <text x="105" y="112" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">ChatGPT</text>

  <!-- Agent 3: Cursor -->
  <rect x="25" y="140" width="135" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Cursor cube icon -->
  <g transform="translate(40, 150)">
    <path d="M12,2 L22,8 L22,18 L12,24 L2,18 L2,8 Z" fill="none" stroke="#e5e5e5" stroke-width="1.5"/>
    <path d="M2,8 L12,14 L22,8" fill="none" stroke="#e5e5e5" stroke-width="1.5"/>
    <path d="M12,14 L12,24" fill="none" stroke="#e5e5e5" stroke-width="1.5"/>
  </g>
  <text x="105" y="167" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">Cursor</text>

  <!-- Agent 4: Gemini -->
  <rect x="25" y="195" width="135" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Gemini 4-pointed soft star -->
  <g transform="translate(40, 205)">
    <path d="M12,0 Q14,10 24,12 Q14,14 12,24 Q10,14 0,12 Q10,10 12,0 Z" fill="url(#geminiGradient)"/>
  </g>
  <text x="105" y="222" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">Gemini</text>

  <!-- Label for agents -->
  <text x="92" y="260" text-anchor="middle" font-size="10" fill="#666">AI Agents</text>

  <!-- ===== CONVERGING LINES: Smooth S-curves from agents to gateway ===== -->
  <!-- Each line: horizontal out, smooth S-curve, horizontal into gateway -->
  <path d="M160,52 C190,52 210,52 230,90 C250,128 260,135 305,135" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowIn)"/>
  <path d="M160,107 C190,107 220,107 245,120 C270,133 280,135 305,135" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowIn)"/>
  <path d="M160,162 C190,162 220,162 245,150 C270,138 280,135 305,135" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowIn)"/>
  <path d="M160,217 C190,217 210,217 230,180 C250,143 260,135 305,135" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowIn)"/>

  <!-- ===== CENTER: Maybe Don't Gateway ===== -->
  <rect x="315" y="35" width="250" height="210" rx="12" fill="#2a2a2a" stroke="#1A40E5" stroke-width="2"/>

  <!-- Gateway header -->
  <text x="440" y="75" text-anchor="middle" font-size="17" font-weight="700" fill="#6699FF">Maybe Don't</text>

  <!-- Label for gateway (below the box) -->
  <text x="440" y="260" text-anchor="middle" font-size="10" fill="#666">MCP Gateway</text>

  <!-- Policy Engine box -->
  <rect x="335" y="100" width="210" height="50" rx="8" fill="#1f1f1f" stroke="#444" stroke-width="1"/>
  <!-- Shield icon -->
  <g transform="translate(350, 113)">
    <path d="M10,0 L0,4 L0,11 C0,16 4,20 10,22 C16,20 20,16 20,11 L20,4 Z" fill="none" stroke="#6699FF" stroke-width="1.5"/>
    <path d="M6,11 L9,14 L14,8" fill="none" stroke="#6699FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="390" y="130" text-anchor="start" font-size="13" font-weight="600" fill="#e5e5e5">Policy Engine</text>

  <!-- Audit Log box -->
  <rect x="335" y="160" width="210" height="50" rx="8" fill="#1f1f1f" stroke="#444" stroke-width="1"/>
  <!-- Document icon -->
  <g transform="translate(350, 171)">
    <rect x="0" y="0" width="16" height="22" rx="2" fill="none" stroke="#6699FF" stroke-width="1.5"/>
    <line x1="4" y1="6" x2="12" y2="6" stroke="#6699FF" stroke-width="1.5"/>
    <line x1="4" y1="11" x2="12" y2="11" stroke="#6699FF" stroke-width="1.5"/>
    <line x1="4" y1="16" x2="9" y2="16" stroke="#6699FF" stroke-width="1.5"/>
  </g>
  <text x="390" y="190" text-anchor="start" font-size="13" font-weight="600" fill="#e5e5e5">Audit Log</text>

  <!-- ===== DIVERGING LINES: Smooth S-curves from gateway to servers ===== -->
  <!-- Each line: horizontal out from gateway, smooth S-curve, horizontal into server -->
  <path d="M565,135 C590,135 610,135 630,90 C650,52 670,52 715,52" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowOut)"/>
  <path d="M565,135 C590,135 610,135 635,120 C660,107 680,107 715,107" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowOut)"/>
  <path d="M565,135 C590,135 610,135 635,150 C660,162 680,162 715,162" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowOut)"/>
  <path d="M565,135 C590,135 610,135 630,180 C650,217 670,217 715,217" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowOut)"/>

  <!-- ===== RIGHT SIDE: MCP Servers ===== -->

  <!-- Server 1: GitHub -->
  <rect x="715" y="30" width="140" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <g transform="translate(730, 40)">
    <path d="M12,0 C5.4,0 0,5.4 0,12 C0,17.3 3.4,21.8 8.2,23.4 C8.8,23.5 9,23.1 9,22.8 L9,20.7 C5.7,21.4 5,19.1 5,19.1 C4.4,17.7 3.6,17.4 3.6,17.4 C2.5,16.6 3.7,16.6 3.7,16.6 C4.9,16.7 5.5,17.9 5.5,17.9 C6.6,19.7 8.4,19.2 9,18.9 C9.1,18.1 9.4,17.5 9.8,17.2 C7.1,16.9 4.3,15.9 4.3,11.3 C4.3,10 4.8,8.9 5.5,8.1 C5.4,7.8 5,6.5 5.6,4.8 C5.6,4.8 6.6,4.5 9,6.1 C10,5.8 11,5.7 12,5.7 C13,5.7 14,5.8 15,6.1 C17.4,4.5 18.4,4.8 18.4,4.8 C19,6.5 18.6,7.8 18.5,8.1 C19.2,8.9 19.7,10 19.7,11.3 C19.7,15.9 16.9,16.9 14.2,17.2 C14.6,17.6 15,18.3 15,19.4 L15,22.8 C15,23.1 15.2,23.5 15.8,23.4 C20.6,21.8 24,17.3 24,12 C24,5.4 18.6,0 12,0 Z" fill="#e5e5e5"/>
  </g>
  <text x="800" y="57" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">GitHub</text>

  <!-- Server 2: Salesforce -->
  <rect x="715" y="85" width="140" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <g transform="translate(730, 95)">
    <path d="M10,8 C10.5,6 12.5,4.5 15,4.5 C18,4.5 20.5,6.5 21,9 C21.3,9 21.7,9 22,9 C24.5,9 26.5,11 26.5,13.5 C26.5,16 24.5,18 22,18 L5,18 C2.5,18 0.5,16 0.5,13.5 C0.5,11.3 2,9.4 4.2,9 C4.1,8.5 4,8 4,7.5 C4,5 6,3 8.5,3 C10.2,3 11.7,4 12.5,5.5 C11.3,6 10.2,6.8 10,8 Z" fill="#00A1E0"/>
  </g>
  <text x="800" y="112" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">Salesforce</text>

  <!-- Server 3: Linear -->
  <rect x="715" y="140" width="140" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Linear - stacked angular lines -->
  <g transform="translate(730, 150)">
    <rect x="0" y="0" width="24" height="24" rx="5" fill="#5E6AD2"/>
    <path d="M6,8 L18,8 M6,12 L18,12 M6,16 L14,16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="800" y="167" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">Linear</text>

  <!-- Server 4: Cloudflare -->
  <rect x="715" y="195" width="140" height="44" rx="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Cloudflare - orange cloud with flare -->
  <g transform="translate(730, 205)">
    <path d="M18,8 C18,5.8 16.2,4 14,4 C12.5,4 11.2,4.8 10.5,6 C10,5.7 9.3,5.5 8.5,5.5 C6.6,5.5 5,7.1 5,9 C5,9.2 5,9.3 5,9.5 C3.3,9.8 2,11.3 2,13 C2,15 3.8,16.5 6,16.5 L18,16.5 C20.2,16.5 22,15 22,13 C22,11.3 20.5,9.8 18.5,9.5 C18.5,9 18,8 18,8 Z" fill="#F6821F"/>
    <path d="M16,10 L20,13 L16,16" fill="none" stroke="#FBAD41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="222" text-anchor="middle" font-size="12" font-weight="500" fill="#e5e5e5">Cloudflare</text>

  <!-- Label for MCP servers -->
  <text x="785" y="260" text-anchor="middle" font-size="10" fill="#666">Downstream MCP Servers</text>

</svg>
