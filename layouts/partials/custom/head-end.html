<!-- Custom JS for sidebar toggle at 1024px breakpoint - works on all pages -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const hamburger = document.querySelector('.hextra-hamburger-menu');
  const sidebar = document.querySelector('.hextra-sidebar-container');

  if (!hamburger || !sidebar) return;

  hamburger.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    // Toggle sidebar visibility
    sidebar.classList.toggle('sidebar-open');

    // Toggle hamburger icon state
    hamburger.querySelector('svg').classList.toggle('open');

    // Prevent body scroll when sidebar is open
    if (sidebar.classList.contains('sidebar-open')) {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
    }
  });

  // Close sidebar when clicking a link (on mobile)
  sidebar.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', function() {
      if (window.innerWidth < 1024 && sidebar.classList.contains('sidebar-open')) {
        sidebar.classList.remove('sidebar-open');
        hamburger.querySelector('svg').classList.remove('open');
        document.body.style.overflow = '';
      }
    });
  });

  // Close sidebar when resizing to desktop
  window.addEventListener('resize', function() {
    if (window.innerWidth >= 1024 && sidebar.classList.contains('sidebar-open')) {
      sidebar.classList.remove('sidebar-open');
      hamburger.querySelector('svg').classList.remove('open');
      document.body.style.overflow = '';
    }
  });
});
</script>

<!-- Toggle switches for feature grid -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.toggle').forEach(function(toggle) {
    toggle.style.cursor = 'pointer';
    toggle.addEventListener('click', function() {
      if (this.classList.contains('on')) {
        this.classList.remove('on');
        this.classList.add('off');
      } else {
        this.classList.remove('off');
        this.classList.add('on');
      }
    });
  });
});
</script>

<!-- Scroll indicator logic (homepage only) -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  var indicator = document.querySelector('.scroll-indicator');
  var featureGrid = document.querySelector('.feature-grid');

  if (!indicator || !featureGrid) return;

  var hasBeenDismissed = false;

  function isMobile() {
    return window.innerWidth <= 1024;
  }

  function hideIndicator() {
    indicator.style.opacity = '0';
    indicator.style.pointerEvents = 'none';
    hasBeenDismissed = true;
  }

  function showIndicator() {
    if (hasBeenDismissed) return;
    indicator.style.display = 'flex';
    // Small delay to ensure display:flex is applied before opacity transition
    requestAnimationFrame(function() {
      indicator.style.opacity = '1';
    });
  }

  function checkAndUpdate() {
    if (hasBeenDismissed) return;

    // Hide on desktop
    if (!isMobile()) {
      indicator.style.display = 'none';
      indicator.style.opacity = '0';
      return;
    }

    // Check if feature grid top is well below the viewport (needs scrolling to see)
    var rect = featureGrid.getBoundingClientRect();
    var belowFold = rect.top > window.innerHeight * 0.9;

    if (belowFold) {
      showIndicator();
    } else {
      indicator.style.display = 'none';
      indicator.style.opacity = '0';
    }
  }

  // Hide on any scroll
  window.addEventListener('scroll', function() {
    if (!hasBeenDismissed && isMobile()) {
      hideIndicator();
    }
  }, { passive: true });

  // Re-check on resize (for responsive mode testing)
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(checkAndUpdate, 100);
  });

  // Initial check with small delay for layout settling
  setTimeout(checkAndUpdate, 100);
});
</script>
