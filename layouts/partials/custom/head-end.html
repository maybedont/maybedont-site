<!-- Custom JS for sidebar toggle at 1024px breakpoint - works on all pages -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const hamburger = document.querySelector('.hextra-hamburger-menu');
  const sidebar = document.querySelector('.hextra-sidebar-container');

  if (!hamburger || !sidebar) return;

  hamburger.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    // Toggle sidebar visibility
    sidebar.classList.toggle('sidebar-open');

    // Toggle hamburger icon state
    hamburger.querySelector('svg').classList.toggle('open');

    // Prevent body scroll when sidebar is open
    if (sidebar.classList.contains('sidebar-open')) {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
    }
  });

  // Close sidebar when clicking a link (on mobile)
  sidebar.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', function() {
      if (window.innerWidth < 1024 && sidebar.classList.contains('sidebar-open')) {
        sidebar.classList.remove('sidebar-open');
        hamburger.querySelector('svg').classList.remove('open');
        document.body.style.overflow = '';
      }
    });
  });

  // Close sidebar when resizing to desktop
  window.addEventListener('resize', function() {
    if (window.innerWidth >= 1024 && sidebar.classList.contains('sidebar-open')) {
      sidebar.classList.remove('sidebar-open');
      hamburger.querySelector('svg').classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  // Handle expandable menu items (Documentation) - make entire row clickable
  sidebar.querySelectorAll('button.hextra-sidebar-collapsible-button').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      var li = btn.closest('li');
      if (li) {
        li.classList.toggle('open');
      }
    });
  });
});
</script>
