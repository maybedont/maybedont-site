<div class="arch-diagram-wrap">
  <svg class="arch-diagram" viewBox="0 0 680 260" width="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowR" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
        <path class="arch-arrow" d="M0,0 L7,2.5 L0,5" fill="none" stroke="#6699FF" stroke-width="1"/>
      </marker>
      <marker id="arrowL" markerWidth="7" markerHeight="5" refX="0" refY="2.5" orient="auto">
        <path class="arch-arrow" d="M7,0 L0,2.5 L7,5" fill="none" stroke="#6699FF" stroke-width="1"/>
      </marker>
      <marker id="arrowD" markerWidth="5" markerHeight="7" refX="2.5" refY="7" orient="auto">
        <path class="arch-arrow" d="M0,0 L5,0 L2.5,7" fill="none" stroke="#6699FF" stroke-width="1"/>
      </marker>
    </defs>

    <!-- ===== ROW 1: MCP Gateway (proxy pattern) ===== -->
    <text class="arch-text-dim" x="340" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#9ca3af" letter-spacing="1">MCP GATEWAY</text>

    <!-- AI Agent box -->
    <rect class="arch-box" x="0" y="24" width="130" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text class="arch-text" x="65" y="40" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">AI Agent</text>
    <text class="arch-text-muted" x="65" y="52" text-anchor="middle" font-size="8" fill="#6b7280">Claude, Cursor, Copilot</text>

    <!-- Arrow: Agent → Maybe Don't -->
    <path class="arch-line" d="M130,38 L222,38" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.45" marker-end="url(#arrowR)"/>
    <text class="arch-text-muted" x="176" y="33" text-anchor="middle" font-size="7.5" fill="#6b7280">tool call</text>

    <!-- Maybe Don't (MCP) -->
    <rect class="arch-shield" x="228" y="22" width="220" height="44" rx="8" fill="#f0f3ff" stroke="#1A40E5" stroke-width="1.5"/>
    <text class="arch-text-brand" x="338" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#1A40E5">Maybe Don't</text>

    <!-- Arrow: Maybe Don't → MCP Server -->
    <path class="arch-line" d="M448,38 L522,38" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.45" marker-end="url(#arrowR)"/>
    <text class="arch-text-allow" x="485" y="33" text-anchor="middle" font-size="7.5" fill="#10b981" font-weight="600">ALLOW</text>

    <!-- MCP Server -->
    <rect class="arch-box" x="528" y="24" width="148" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text class="arch-text" x="602" y="40" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">MCP Server</text>
    <text class="arch-text-muted" x="602" y="52" text-anchor="middle" font-size="8" fill="#6b7280">GitHub, Slack, DB, etc.</text>

    <!-- ===== ROW 2: Agent Hook (callback pattern) ===== -->
    <text class="arch-text-dim" x="340" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#9ca3af" letter-spacing="1">AGENT HOOK</text>

    <!-- Agent / CLI box -->
    <rect class="arch-box" x="0" y="100" width="130" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text class="arch-text" x="65" y="116" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">Agent / CLI</text>
    <text class="arch-text-muted" x="65" y="128" text-anchor="middle" font-size="8" fill="#6b7280">Claude Code, shell</text>

    <!-- Arrow: Agent → Maybe Don't (ask) -->
    <path class="arch-line" d="M130,113 L222,113" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.45" marker-end="url(#arrowR)"/>
    <text class="arch-text-muted" x="176" y="108" text-anchor="middle" font-size="7.5" fill="#6b7280">evaluate</text>

    <!-- Maybe Don't (Hook) -->
    <rect class="arch-shield" x="228" y="98" width="220" height="44" rx="8" fill="#f0f3ff" stroke="#1A40E5" stroke-width="1.5"/>
    <text class="arch-text-brand" x="338" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#1A40E5">Maybe Don't</text>

    <!-- Arrow: Maybe Don't → Agent (response) -->
    <path class="arch-line" d="M228,126 L130,126" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.45" marker-end="url(#arrowL)"/>
    <text class="arch-text-allow" x="176" y="137" text-anchor="middle" font-size="7.5" fill="#10b981" font-weight="600">ALLOW / BLOCK</text>

    <!-- Continues label -->
    <text class="arch-text-muted" x="602" y="124" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">Agent continues</text>
    <text class="arch-text-muted" x="602" y="135" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">or halts</text>

    <!-- ===== ROW 3: REST API (direct call) ===== -->
    <text class="arch-text-dim" x="340" y="166" text-anchor="middle" font-size="9" font-weight="600" fill="#9ca3af" letter-spacing="1">REST API</text>

    <!-- External System box -->
    <rect class="arch-box" x="0" y="176" width="130" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text class="arch-text" x="65" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">External System</text>
    <text class="arch-text-muted" x="65" y="204" text-anchor="middle" font-size="8" fill="#6b7280">OpenHands, custom</text>

    <!-- Arrow: System → Maybe Don't -->
    <path class="arch-line" d="M130,189 L222,189" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.45" marker-end="url(#arrowR)"/>
    <text class="arch-text-muted" x="176" y="184" text-anchor="middle" font-size="7.5" fill="#6b7280">validate</text>

    <!-- Maybe Don't (API) -->
    <rect class="arch-shield" x="228" y="174" width="220" height="44" rx="8" fill="#f0f3ff" stroke="#1A40E5" stroke-width="1.5"/>
    <text class="arch-text-brand" x="338" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#1A40E5">Maybe Don't</text>

    <!-- Arrow: Maybe Don't → System (response) -->
    <path class="arch-line" d="M228,202 L130,202" fill="none" stroke="#6699FF" stroke-width="1.5" opacity="0.45" marker-end="url(#arrowL)"/>
    <text class="arch-text-allow" x="176" y="213" text-anchor="middle" font-size="7.5" fill="#10b981" font-weight="600">ALLOW / BLOCK</text>

    <!-- ===== BOTTOM: Audit log/SIEM push ===== -->
    <rect class="arch-box" x="528" y="176" width="148" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <!-- Log/export icon: document with outward arrow -->
    <g class="arch-icon" transform="translate(540, 183)">
      <rect x="0" y="0" width="13" height="16" rx="2" fill="none" stroke="#1A40E5" stroke-width="1.2"/>
      <path d="M3.5,4 H9 M3.5,7.5 H9 M3.5,11 H7" stroke="#1A40E5" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M16,8 L22,8 M19,5 L22,8 L19,11" fill="none" stroke="#1A40E5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="arch-text" x="602" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#111827" dx="10">Audit &amp; SIEM</text>
    <text class="arch-text-muted" x="602" y="204" text-anchor="middle" font-size="7.5" fill="#6b7280" dx="10">Splunk · Elastic · Datadog</text>

    <!-- Arrows from all three Maybe Don't boxes to Audit -->
    <path class="arch-line arch-line-dash" d="M448,50 C490,50 508,195 528,195" fill="none" stroke="#6699FF" stroke-width="1" opacity="0.3" stroke-dasharray="3,2" marker-end="url(#arrowR)"/>
    <path class="arch-line arch-line-dash" d="M448,126 C490,126 508,195 528,195" fill="none" stroke="#6699FF" stroke-width="1" opacity="0.3" stroke-dasharray="3,2" marker-end="url(#arrowR)"/>
    <path class="arch-line arch-line-dash" d="M448,196 L528,196" fill="none" stroke="#6699FF" stroke-width="1" opacity="0.3" stroke-dasharray="3,2" marker-end="url(#arrowR)"/>

    <!-- "all events" label near audit -->
    <text class="arch-text-dim" x="498" y="174" text-anchor="middle" font-size="7" fill="#9ca3af" font-style="italic">all events</text>
  </svg>
</div>
