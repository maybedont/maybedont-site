{{ define "main" }}
<main class="hx:grow">
  <div class="error-page-container">
    <div class="error-page-content">
      <div class="error-page-code">404</div>
      <h1 class="error-page-title">Page not found</h1>
      <p class="error-page-message">
        If you followed a link and ended up here, <strong>maybe do</strong> <a class="link-primary" target="_" href="https://github.com/maybedont/maybedont-issues/issues/new?template=website-issue.yml&title=found a broken link&labels=website">open an issue</a> so we can fix it!
      </p>
      <div class="error-page-actions">
        <a href="/" class="cta-primary">
          Go to Homepage
        </a>
        <a href="/docs/" class="cta-secondary">
          View Documentation
        </a>
      </div>
      <div class="error-page-links">
        <span>Or try:</span>
        <a href="/pricing/">Pricing</a>
        <a href="/blog/">Blog</a>
      </div>
    </div>
  </div>
</main>
{{ end }}
